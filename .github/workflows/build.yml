name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # The default list still contains the removed "tools" package.
          packages: 'platform-tools'

      - name: Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" || sdkmanager "platforms/android-37.0" "build-tools/37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "SIGNING_ARG=-PsplashCleanSigning=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease $SIGNING_ARG --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          v="${GITHUB_REF_NAME}"
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/SplashClean-$v-$abi.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk

      # Only publish APKs signed with the real key, so updates install over older versions.
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
